<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Gradient Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Technical Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Glow Aura -->
  <circle cx="1020" cy="240" r="240" fill="#f97316" fill-opacity="0.15" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="180" fill="#2563eb" fill-opacity="0.1" filter="blur(50px)"/>

  <!-- Card Frame -->
  <rect x="60" y="60" width="1080" height="555" rx="24" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Tag Pill -->
  <rect x="110" y="110" width="280" height="36" rx="18" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-opacity="0.6"/>
  <text x="130" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fb923c" letter-spacing="1">B2B WHOLESALE &amp; DISTRIBUTION</text>

  <!-- Main Headline -->
  <text x="110" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Best Wholesale Billing Software</text>
  <text x="110" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f97316" letter-spacing="-0.5">In India (2026 Benchmark)</text>

  <!-- Subtitle -->
  <text x="110" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">Party-Wise Rate Contracts, Credit Limits, E-Way Bill &amp; Multi-Unit Packing Guide</text>

  <!-- Feature Pills Grid -->
  <g transform="translate(110, 380)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="60" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">📦 Multi-Unit Packing</text>
    
    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="60" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="260" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">⚡ 1-Click E-Way Bill</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="60" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="500" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">💰 Credit Lock &amp; Aging</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="220" height="60" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="740" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">📱 WhatsApp Receipts</text>
  </g>

  <!-- Bottom Brand Footprint -->
  <line x1="110" y1="510" x2="1050" y2="510" stroke="#334155" stroke-opacity="0.6"/>
  <text x="110" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">UdyogBill Enterprise</text>
  <text x="280" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b">• 100% Offline-First Cloud Sync for Indian MSMEs &amp; Traders</text>
</svg>